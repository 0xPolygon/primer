name: Publish @polygonlabs/primer-mcp

# Publishes apps/mcp to npm under @polygonlabs/primer-mcp.
#
# Triggers:
#   - Pushing a tag matching `mcp-v*` (recommended: `mcp-v1.0.0`).
#   - Manual `workflow_dispatch` from the Actions tab (useful for re-running
#     a release without re-tagging).
#
# Required secret: NPM_TOKEN — an npm "Automation" token with publish access
# to the @polygonlabs scope. Generate at https://www.npmjs.com/settings/tokens
# (scope: Automation, no IP restrictions), then add as a repo or org secret.
#
# Required setup (one-time): the @polygonlabs npm org must exist and the
# token's user must be a member with publish permission.
#
# The job verifies the tag matches apps/mcp/package.json's version before
# publishing — so `mcp-v1.0.0` will refuse to publish a package whose version
# field is 1.0.1.

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version to publish (must match apps/mcp/package.json). Leave empty to use package.json as-is.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./apps/mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/mcp/package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Publishing @polygonlabs/primer-mcp@$PKG_VERSION"

      - name: Typecheck
        run: pnpm --filter @polygonlabs/primer-mcp typecheck

      - name: Test
        run: pnpm --filter @polygonlabs/primer-mcp test

      - name: Build
        run: pnpm --filter @polygonlabs/primer-mcp build

      - name: Publish to npm
        run: pnpm --filter @polygonlabs/primer-mcp publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
