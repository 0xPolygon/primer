name: CI

on:
  pull_request:
    # Any base branch, so PRs stacked on another PR's branch get CI too.
    branches: ['**']
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: typecheck · build · test
    runs-on: ubuntu-latest

    # Job-wide so the migrate step and the API tests (apps/api/vitest.config.ts
    # reads it) use the same database.
    env:
      DATABASE_URL_TEST: postgres://primer:primer@localhost:5432/primer_test

    # API tests talk to a real Postgres at DATABASE_URL_TEST. Matches the
    # postgres:17.9 image used in docker-compose.yml for local dev.
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: primer
          POSTGRES_PASSWORD: primer
          POSTGRES_DB: primer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primer -d primer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version is read from the "packageManager" field in package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile keeps the supply-chain hardening intact (installs the
      # pinned lockfile versions; never re-resolves past the minimumReleaseAge
      # gate). esbuild's approved build script runs here as normal.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails if a plugin's .claude-plugin/plugin.json version was hand-edited
      # out of sync with its package.json — changesets owns plugin versions
      # (mirrored at release time by `ci:version`; see release.yml).
      - name: Check plugin version sync
        run: pnpm run codegen-drift-check

      - name: Migrate test database
        run: pnpm db:migrate:test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r run build

      - name: Test
        run: pnpm test

  audit:
    name: pnpm audit (non-blocking)
    runs-on: ubuntu-latest
    # Advisories are surfaced but do not block merges: a fresh upstream advisory
    # in an unrelated dependency should not red-X PRs that never touched it.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high
