name: Release

# Calls the shared 0xPolygon/pipelines release workflow with `version_script`
# on. This repo is also a Claude Code plugin marketplace: the version plugin
# users receive lives in plugins/*/.claude-plugin/plugin.json, and Claude Code
# compares that file to decide whether a client's cached copy is stale. A bare
# `changeset version` stops at package.json and would ship the new version to
# nobody, so the shared workflow runs the root `ci:version` script instead
# (`changeset version`, then mirror each package version into its plugin.json).
# Keep `ci:version` running `changeset version` itself: the shared workflow
# only substitutes the script for that command.
#
# The Version Packages PR is the deliberate human release gate: merging it is
# the release. It publishes the npm packages, pushes the release tags, and the
# `@primer/api@X.Y.Z` tag triggers docker-release-trigger.yml, which tests and
# publishes the service image that Kargo then promotes manually. One human
# merge therefore gates the service image, the npm packages and the plugin
# content together, so none of them reaches consumers ahead of the others.
#
# The file name is fixed: the npm trusted-publisher configs for the published
# packages name this workflow file.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write # build provenance attestations in the called release workflow

jobs:
  release:
    uses: 0xPolygon/pipelines/.github/workflows/apps-npm-release.yml@main
    with:
      version_script: true
    secrets:
      CHANGESET_RELEASE_BOT_APP_ID: ${{ secrets.CHANGESET_RELEASE_BOT_APP_ID }}
      CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY: ${{ secrets.CHANGESET_RELEASE_BOT_APP_PRIVATE_KEY }}
