packages:
  - 'apps/*'
  - 'packages/*'
  # Versioning shells only — each plugin's package.json exists so changesets
  # can version it; the mirror script copies that version into the plugin
  # manifest Claude Code clients actually read (.claude-plugin/plugin.json).
  - 'plugins/*'

# Supply-chain hardening (see design spec, Section "Supply-chain hardening")
minimumReleaseAge: 20160 # 14 days, in minutes
# Packages allowed to bypass the minimumReleaseAge gate. Use sparingly and
# only for well-established packages with active security maintenance — the
# point of the gate is to catch malicious publishes during their first two
# weeks of life. Each entry needs a one-line justification.
minimumReleaseAgeExclude: []
blockExoticSubdeps: true
# Packages allowed to run postinstall/preinstall scripts.
# Each entry is reviewed individually. NEVER approve sight-unseen.
allowBuilds:
  # esbuild downloads a platform-specific native binary from npm under
  # the @esbuild scope. Required transitively by drizzle-kit, and used
  # directly by apps/api for its production build.
  esbuild: true
# Transitive override: drizzle-kit pulls esbuild via @esbuild-kit/core-utils
# (deprecated), which pins esbuild <=0.24.2 — vulnerable to GHSA-67mh-4wv8-2f99
# (dev-server CSRF). The CVE only affects esbuild's dev server, which we never
# start — drizzle-kit only invokes esbuild as a CLI bundler. Force the
# transitive copy to a patched version to clear the audit noise.
#
# Transitive override: jsdom (test DOM env, dev-only) pulls undici affected by
# several advisories (TLS bypass, WS DoS, SOCKS5 routing, Set-Cookie injection,
# cache disclosure, and cross-user info disclosure fixed in 7.29.0). undici is
# never in the production path. Pin to the patched 7.29 line; kept on ^7 to stay
# compatible with jsdom.
#
# Transitive DoS / parser-confusion advisories (all `high`, surfaced by
# `pnpm audit --audit-level=high`): quadratic-complexity CPU DoS or host/path
# confusion in transitive parsers. Each override pins the transitive to its
# patched floor; none changes production behaviour. js-yaml is scoped per-major
# because two consumers sit on different lines (gray-matter on 3.x, the diff
# viewer on 4.x) and must not be force-migrated across a major.
overrides:
  esbuild: '^0.25.0'
  undici: '^7.29.0'
  'js-yaml@3': '^3.15.1'   # gray-matter (api) — GHSA-52cp-r559-cp3m + !!omap quadratic CPU
  'js-yaml@4': '^4.3.1'    # react-diff-viewer-continued (web) — same advisories, 4.x line
  linkify-it: '^5.0.2'     # markdown-it (api) — GHSA-v245-v573-v5vm mailto: scan-loop DoS
  fast-uri: '^3.1.6'       # @modelcontextprotocol/sdk>ajv (api) — host confusion + SSRF (patched 3.1.6)
  ip-address: '^10.3.1'    # @modelcontextprotocol/sdk (api) — leading-zero octet decode
  postcss: '^8.5.18'       # sanitize-html (api) — source-map path traversal
  nanoid: '^3.3.18'        # sanitize-html>postcss (api) — generator infinite-loop DoS
  hono: '^4.12.34'         # @modelcontextprotocol/sdk + @hono/node-server (api) — CORS ReDoS, memo() SSR bleed, lang-mw DoS, proxy-header leak (patched 4.12.34)
  '@hono/node-server@1': '^1.19.15'  # @modelcontextprotocol/sdk (api) — serve-static path traversal; SDK stays on its 1.x line
  body-parser: '^2.3.0'    # @modelcontextprotocol/sdk>express (api) — DoS via invalid limit disabling the size cap (patched 2.3.0)
  # qs '^6.16.0' (2 moderate: array-limit bypass + isBuffer DoS) is DEFERRED:
  # 6.16.0 (published 2026-08-29) sits inside the 14-day gate until ~2026-09-12.
strictPeerDependencies: true
engineStrict: true
